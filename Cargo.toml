[package]
name = "poe2-tracker"
version = "0.9.8"
edition = "2024"
license = "MIT"

[workspace]
members = ["shared", "server"]

[dependencies]
arboard = "3"
bcdec_rs = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
device_query = "2"
directories = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
oozextract = "0.5"
poe2-shared = { path = "shared" }
regex = "1"
rfd = "0.15"
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }
self-replace = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
