<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs>    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a25a"/><stop offset="0.3" stop-color="#7a5826"/>
      <stop offset="0.6" stop-color="#3b2710"/><stop offset="0.85" stop-color="#8f6a30"/><stop offset="1" stop-color="#4a3214"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="grime" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 0 0  0 0 0 -3 1.9" result="spots"/>
      <feComposite in="spots" in2="SourceGraphic" operator="in" result="s"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette" r="75%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a1e16"/><stop offset="1" stop-color="#070504"/></radialGradient>
    <radialGradient id="iris" r="50%"><stop offset="0" stop-color="#ffcc66"/><stop offset=".35" stop-color="#d23a0e"/><stop offset=".8" stop-color="#4a0703"/><stop offset="1" stop-color="#140100"/></radialGradient>
    <radialGradient id="sclera" r="60%"><stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#0b0705"/></radialGradient>
</defs>
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  <g filter="url(#rough)">
    <rect x="22" y="22" width="212" height="212" rx="6" fill="#0a0705" stroke="url(#bronze)" stroke-width="14" filter="url(#grime)"/>
    <path d="M22 22 l26 0 l-26 26z M234 22 l-26 0 l26 26z M22 234 l26 0 l-26 -26z M234 234 l-26 0 l26 -26z" fill="url(#bronze)"/>
    <path d="M30 128 Q128 34 226 128 Q128 222 30 128 Z" fill="url(#sclera)" stroke="url(#bronze)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g stroke="#6a0f08" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M52 124 q20 -6 34 4 q8 5 18 2"/><path d="M60 140 q18 4 30 -2"/><path d="M204 122 q-18 -4 -30 6 q-6 4 -14 2"/><path d="M198 140 q-16 6 -30 -2"/>
  </g>
  <circle cx="128" cy="128" r="44" fill="url(#iris)" filter="url(#glow)"/>
  <g stroke="#2a0402" stroke-width="1.5" opacity=".6">
    <line x1="128" y1="86" x2="128" y2="100"/><line x1="98" y1="98" x2="107" y2="107"/><line x1="158" y1="98" x2="149" y2="107"/><line x1="98" y1="158" x2="107" y2="149"/><line x1="158" y1="158" x2="149" y2="149"/>
  </g>
  <path d="M128 92 Q140 128 128 164 Q116 128 128 92Z" fill="#050100"/>
  <circle cx="113" cy="111" r="4" fill="#ffe9c0" opacity=".55"/>
  <path d="M60 60 L84 86 L78 100 M196 196 L176 176" stroke="#000" stroke-width="2" fill="none" opacity=".6"/>
  <rect width="256" height="256" rx="40" fill="url(#vignette)"/>
</svg>
